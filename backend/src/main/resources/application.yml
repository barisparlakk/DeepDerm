spring:
  application:
    name: DeepDerm

  datasource:
    url: jdbc:postgresql://localhost:5432/deepderm
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  web:
    resources:
      static-locations: file:uploads/,classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:deepderm-super-secret-key-change-in-production-must-be-32-chars-min}
    expiration-ms: 86400000   # 24 hours
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    com.deepderm: DEBUG
    org.springframework.security: INFO
